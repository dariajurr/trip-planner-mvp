<dialog #dialog class="sheet" (close)="closed.emit()" (click)="onBackdrop($event)" aria-labelledby="picker-title">
  <div class="sheet-body">
    <header class="sheet-head">
      <h2 id="picker-title">Добавить остановки</h2>
      <button type="button" class="x" (click)="close()" aria-label="Закрыть">✕</button>
    </header>

    <input class="search" type="search" placeholder="Поиск по названию или району" [value]="query()" (input)="onQuery($event)" />
    <label class="field">
      <select [value]="areaId()" (change)="onArea($event)" aria-label="Район">
        <option value="">Все районы</option>
        @for (a of areas(); track a.id) {
          <option [value]="a.id">{{ a.name }}</option>
        }
      </select>
    </label>

    @if (hasAnchor()) {
      <p class="hint">Сначала ближайшие к последней остановке.</p>
    }

    <ul class="list">
      @for (c of candidates(); track c.id) {
        <li>
          <button type="button" class="row" [class.on]="orderOf(c.id) > 0" [attr.aria-pressed]="orderOf(c.id) > 0" (click)="toggle(c.id)">
            <span class="mark" aria-hidden="true">{{ orderOf(c.id) > 0 ? orderOf(c.id) : '' }}</span>
            <span class="txt">
              <b>{{ c.icon }} {{ c.name }}</b>
              <span class="muted small">{{ c.areaName }}@if (c.distance) { · {{ c.distance }} от последней}</span>
            </span>
            @if (c.must) {
              <span class="badge must">Must</span>
            }
          </button>
        </li>
      } @empty {
        <li class="empty">Подходящих точек нет. Все уже в маршруте или фильтры слишком узкие.</li>
      }
    </ul>

    <footer class="sheet-foot">
      <button type="button" class="btn primary" [disabled]="!selected().length" (click)="confirm()">
        Добавить{{ selected().length ? ' (' + selected().length + ')' : '' }}
      </button>
      <button type="button" class="btn" (click)="close()">Отмена</button>
    </footer>
  </div>
</dialog>
