<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Trip Planner</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f1">
  <script>
    // Apply the saved colour theme and text size before the app starts, so the page never flashes the wrong colours.
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('trip-app.settings.v1') || '{}');
        var theme = s.theme || 'classic';
        if (theme === 'auto') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'classic';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.text = s.textSize || 'normal';
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="Планировщик путешествия: маршруты, брони, погода и видимость Фудзи. Работает без интернета.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trip">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <app-root></app-root>
  <noscript>Для работы Trip Planner нужен включённый JavaScript.</noscript>
</body>
</html>
